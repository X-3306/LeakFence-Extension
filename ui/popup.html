<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LeakFence Local</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="top">
        <img src="../assets/icon.png" width="34" height="34" alt="">
        <div>
          <h1>LeakFence</h1>
          <p id="origin" data-i18n="checkingTab">Checking tab...</p>
        </div>
        <a class="iconLink" href="https://github.com/X-3306/LeakFence-Extension" target="_blank" rel="noreferrer" title="GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.1c-3.34.73-4.04-1.42-4.04-1.42-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.21.08 1.85 1.24 1.85 1.24 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.66-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.45 11.45 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.62-5.49 5.92.43.37.81 1.1.81 2.22v3.3c0 .32.22.7.83.58A12 12 0 0 0 12 .5Z"/></svg>
        </a>
      </header>

      <section class="status" id="status">
        <strong id="statusTitle">Active</strong>
        <span id="statusText" data-i18n="statusText">LeakFence only runs on supported AI chats.</span>
      </section>

      <dl class="metrics">
        <div>
          <dt data-i18n="secrets">Secrets</dt>
          <dd id="credentialCount">0</dd>
        </div>
        <div>
          <dt data-i18n="policy">Policy</dt>
          <dd id="policyVersion">v-</dd>
        </div>
      </dl>

      <div class="actions">
        <button id="protectSite" type="button" class="secondary" data-i18n="addSecret">Add secret</button>
        <button id="openOptions" type="button" data-i18n="options">Options</button>
      </div>

      <section class="privacyStrip" aria-label="Privacy guarantees">
        <span data-i18n="privacyLocal">Local only</span>
        <span data-i18n="privacyNoTelemetry">No data collected</span>
        <span data-i18n="privacyOpenSource">Open source</span>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
